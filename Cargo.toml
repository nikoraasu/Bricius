[package]
name = "bryce_modern"
version = "0.1.0"
edition = "2024"

[lib]
name = "bryce_modern"
path = "src/lib.rs"

[[bin]]
name = "bryce_modern"
path = "src/main.rs"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
egui = "0.35"
egui-wgpu = "0.35"
egui-winit = "0.35"
env_logger = "0.11.12"
glam = "0.34.3"
gltf = "1.4.1"
image = "0.25.10"
log = "0.4.35"
pollster = "1.0.3"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tobj = "4.0.5"
wgpu = "29.0.4"
winit = "0.30.13"
